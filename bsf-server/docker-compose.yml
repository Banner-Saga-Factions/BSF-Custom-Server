services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    env_file: .env
    networks:
      - backend
    depends_on:
      - app

  app:
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/bsf.db
      # This file is what puts Caddy in front of the app, so this file is where we
      # say so (#284). Without it every request looks like it came from Caddy and
      # all players share one cap of five sign-ins a minute. Set here rather than in
      # .env because an entry here overrides .env and cannot be forgotten while
      # editing it -- and because running the image any other way, with nothing in
      # front, must not inherit it.
      TRUST_PROXY: "true"
    volumes:
      - db-data:/data
    networks:
      - backend

volumes:
  db-data:
    name: bsf-server_db-data
  caddy-data:

networks:
  backend:
