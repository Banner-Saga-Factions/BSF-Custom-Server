services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    env_file: .env
    networks:
      - backend
    depends_on:
      - app

  app:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/db/bsf.db
    volumes:
      - db-data:/app/db
    networks:
      - backend

volumes:
  db-data:
    name: bsf-server_db-data
  caddy-data:

networks:
  backend:
