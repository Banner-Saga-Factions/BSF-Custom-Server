# Keeps the guides that are handed to a session BEFORE it starts from growing
# without anyone noticing.
#
# These five files are loaded automatically — nobody opens them on purpose — so
# every word in them is paid for whether or not that session needed it. On
# 2026-09-09 more than half of bsf-server/CLAUDE.md was deleted for that reason,
# taking it from 43,262 bytes to 20,176. Eleven days later it was back to 32,140.
# Nothing noticed, because nothing was watching. This is the thing that watches.
# The case is written up in bsf-server/docs/retrospectives.md, under "Trimming a
# guide does not keep it trimmed".
#
# Note that this file's budget for bsf-server/CLAUDE.md is set just above today's
# size - 33,000 against 32,140 - so it stops that file rising without bringing it
# down. That 860 bytes of slack is under a day of growth at the rate measured in
# the retrospective, so treat it as a backstop rather than room to fill. Issue #296
# is the work of bringing the file down, and lowers this number when it lands.
#
# WHY IT MEASURES THE COMMITTED FILE AND NOT THE ONE ON DISK
# Our working copies have mixed line endings: core.autocrlf is true, there is no
# .gitattributes at the top of the repository, and on 2026-09-20 the root guide
# carried 109 carriage-return bytes on disk, the traps file 35, and
# bsf-server/CLAUDE.md none at all. So `wc -c` reads a larger number on a Windows
# checkout than on this Linux runner, drifting by one byte per line — 109 bytes
# for the root guide. `git ls-tree -l` reports the size of the file as stored,
# which is the same everywhere. path-rot.yml has a note about the same trap.
#
# WHEN THIS FAILS, MOVE MATERIAL OUT RATHER THAN COMPRESSING IT. Rewriting prose
# is where errors get introduced (about 4 per 100 lines, measured on
# docs/client-contract.md); moving a passage whole introduces none. Raising a
# budget is allowed when the material genuinely belongs here — say why in the
# pull request, so the next person sees a decision rather than a drift.

name: context-budget
on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        # No submodule recursion. bsf-client/ is a separate repository with its own
        # history, and a submodule checkout would measure whatever commit the pin
        # points at rather than what is on its default branch. Note that nothing
        # watches its guides either - it has no CI at all, and its root guide is
        # larger than ours. Tracked as Banner-Saga-Factions/BSF-Client#54.

      - name: Compare each automatically-loaded guide against its budget
        run: |
          # "<path>:<limit>", limits in COMMITTED bytes.
          #
          # The comment beside each one says WHY it is on the list, not how big it is
          # or how many sessions get it: the run prints the live size below, and any
          # count written here would age every time somebody opens a session and would
          # have nowhere to carry what it does and does not cover. Those numbers, with
          # their limits, live in bsf-server/docs/README.md under "What it costs now".
          budgets=(
            "CLAUDE.md:12500"                            # every session, both repos - the expensive one
            "bsf-server/CLAUDE.md:33000"                 # every session that opens anything in bsf-server/
            "bsf-server/.claude/rules/gotchas.md:27000"  # code traps: src/, test/, data/, settings files
            "bsf-server/.claude/rules/ops.md:4000"       # deployment traps: deploy/, scripts/, any .ps1 or .bat
            "bsf-server/.claude/rules/db.md:4000"        # database rules: work touching src/db/
          )

          fail=0
          total=0

          for entry in "${budgets[@]}"; do
            path=${entry%:*}
            limit=${entry##*:}

            # Fields 1 and 4 of `git ls-tree -l` are the mode and the stored size.
            # A path that no longer exists prints nothing; a path that became a
            # directory or a submodule prints "-" for the size. A symlink prints a
            # real number - the length of the target path - so the size alone cannot
            # tell us it is one, and its mode is checked below as well.
            entry=$(git ls-tree -l HEAD -- "$path" | awk '{print $1, $4}')
            mode=${entry%% *}
            size=${entry##* }

            case "$mode:$size" in
              100644:*[0-9] | 100755:*[0-9]) ;;
              *)
                echo "::error::Budgeted file is missing, or is no longer a single file: $path"
                echo "    A budget that quietly stops applying is worse than no budget at all."
                echo "    If the file moved, update the list in this workflow. If it is gone, delete its line."
                fail=1
                continue
                ;;
            esac

            case "$limit" in
              '' | *[!0-9]*)
                echo "::error::Budget for $path is not a number: '$limit'"
                echo "    Left unchecked this passes green: the comparison below errors,"
                echo "    the error is swallowed by the 'if', and the file goes unbudgeted."
                echo "    A budget that quietly stops applying is worse than no budget at all."
                fail=1
                continue
                ;;
            esac

            total=$((total + size))

            if [ "$size" -gt "$limit" ]; then
              over=$((size - limit))
              echo "::error file=$path::$path is $size bytes, which is $over over its budget of $limit"
              fail=1
            else
              printf 'ok    %-40s %6s / %6s\n' "$path" "$size" "$limit"
            fi
          done

          echo
          echo "Total handed to a session that opens the server: $total bytes"

          if [ "$fail" -ne 0 ]; then
            echo
            echo "These files are read before any work begins, so every word is paid for"
            echo "whether the session needed it or not. Get back under budget by moving"
            echo "material out, not by compressing it. Where each kind goes is set out in"
            echo "bsf-server/CLAUDE.md under 'Code Review', in the routing table:"
            echo
            echo "  the case behind a rule ........ bsf-server/docs/retrospectives.md"
            echo "  the evidence behind a trap .... the docs/ page that owns the subject"
            echo "  a reusable concept ............ the docs suite (bsf-server/docs/README.md)"
            echo "  an idea we are not building ... bsf-server/docs/idea-triage.md"
            echo
            echo "Raising a budget is allowed when the material genuinely belongs here."
            echo "Say why in the pull request."
          fi

          exit $fail
